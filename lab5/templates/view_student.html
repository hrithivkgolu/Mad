<!DOCTYPE html>
<html>
<body>

<h1>Student Details</h1>


<table id = "personal-details">
<tr>
<th>Roll Number</th>
<th>First Name</th>
<th>Last Name</th>
</tr>
<tr>
<td>{{student[1]}}</td>
<td>{{student[2]}}</td>
<td>{{student[3]}}</td>
</tr>
</table>

<br><br>

<h1>Enrollment list</h1>

<table id="enroll-table">
<tr>
<th>S. No.</th>
<th>Course Code</th>
<th>Course Name</th>
<th>Course Description</th>
</tr>

{% for course in enrollments %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ course[0] }}</td>
<td>{{ course[1] }}</td>
<td>{{ course[2] }}</td>
</tr>
{% endfor %}

</table>

<br><br>

<a href="/">
    <button>Go Back</button>
</a>

</body>
</html>
